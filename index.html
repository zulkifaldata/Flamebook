<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlameBook</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --brand:#e8590c; --brand-dark:#c2410c; --line:#e5e7eb; --err:#b91c1c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; justify-content:center; }
  main { width:100%; max-width:420px; padding:24px 16px 40px; }
  h1 { margin:8px 0 4px; font-size:26px; color:var(--brand); }
  .sub { color:var(--muted); margin:0 0 20px; font-size:15px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .list { display:grid; gap:10px; }
  .pick { width:100%; padding:16px; font-size:18px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); text-align:left; cursor:pointer; }
  .pick:active { background:#fff3eb; border-color:var(--brand); }
  .back { background:none; border:none; color:var(--brand-dark); font-size:15px; padding:8px 0; cursor:pointer; }
  .dots { display:flex; justify-content:center; gap:14px; margin:14px 0 18px; }
  .dot { width:16px; height:16px; border-radius:50%; border:2px solid var(--brand); }
  .dot.on { background:var(--brand); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pad button { padding:18px 0; font-size:24px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); cursor:pointer; }
  .pad button:active { background:#fff3eb; }
  .msg { min-height:22px; text-align:center; font-size:15px; margin-top:12px; }
  .msg.err { color:var(--err); }
  .row { display:flex; gap:8px; margin-top:12px; }
  input[type=text] { flex:1; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:10px; }
  .primary { padding:12px 16px; font-size:16px; border:none; border-radius:10px; background:var(--brand); color:#fff; cursor:pointer; }
  .secondary { padding:10px 14px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); cursor:pointer; }
  ul { padding-left:18px; margin:10px 0 0; }
  .hide { display:none; }
</style>
</head>
<body>
<main>
  <h1>FlameBook</h1>
  <p class="sub" id="sub">Loading...</p>

  <!-- Screen 1: branch -->
  <section id="s-branch" class="hide"><div class="list" id="branchList"></div></section>

  <!-- Screen 2: staff name -->
  <section id="s-staff" class="hide">
    <button class="back" id="backToBranch">&larr; Change branch</button>
    <div class="list" id="staffList"></div>
  </section>

  <!-- Screen 3: PIN -->
  <section id="s-pin" class="hide">
    <button class="back" id="backToStaff">&larr; Change name</button>
    <div class="card">
      <div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="pad" id="pad"></div>
      <div class="msg" id="pinMsg"></div>
    </div>
  </section>

  <!-- Screen 4: welcome -->
  <section id="s-home" class="hide">
    <div class="card">
      <strong id="welcome"></strong>
      <p class="sub" style="margin:6px 0 0" id="whereAmI"></p>
      <div class="row">
        <input type="text" id="custName" placeholder="Test customer name" autocomplete="off">
        <button class="primary" id="addCust">Add</button>
      </div>
      <div class="msg" id="homeMsg"></div>
      <div><strong>Customers in this branch</strong> <span id="custCount"></span></div>
      <ul id="custList"></ul>
    </div>
    <p style="text-align:center;margin-top:16px"><button class="secondary" id="logout">Logout</button></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // ====== EDIT THESE 3 LINES ======
  const SUPABASE_URL  = "https://yqhvegqrtgtnhjrtjzhi.supabase.co";            // e.g. https://abcdxyz.supabase.co
  const SUPABASE_KEY  = "sb_publishable_bMPAfVEyj2GVTESsIyw1oA_NrOSnsuZ";; // public key only. NEVER the secret / service_role key
  const BUSINESS_SLUG = "hussain-lpg-traders";
  // =================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);
  const screens = ["s-branch", "s-staff", "s-pin", "s-home"];
  let chosenBranch = null, chosenStaff = null, pin = "", busy = false, me = null;

  function show(id, subtitle) {
    screens.forEach((s) => $(s).classList.toggle("hide", s !== id));
    $("sub").textContent = subtitle;
  }

  function makeButton(text, onClick) {
    const b = document.createElement("button");
    b.className = "pick";
    b.textContent = text;
    b.onclick = onClick;
    return b;
  }

  async function loadBranches() {
    show("s-branch", "Choose your branch");
    const { data, error } = await sb.rpc("login_branches", { p_slug: BUSINESS_SLUG });
    const box = $("branchList");
    box.innerHTML = "";
    if (error || !data || !data.length) { box.textContent = "Could not load branches. Check the URL and key at the top of this file."; return; }
    data.forEach((b) => box.appendChild(makeButton(b.name, () => { chosenBranch = b; loadStaff(); })));
  }

  async function loadStaff() {
    show("s-staff", chosenBranch.name);
    const { data, error } = await sb.rpc("login_staff", { p_branch: chosenBranch.id });
    const box = $("staffList");
    box.innerHTML = "";
    if (error || !data || !data.length) { box.textContent = "No staff found for this branch."; return; }
    data.forEach((s) => box.appendChild(makeButton(s.name, () => { chosenStaff = s; startPin(); })));
  }

  function buildPad() {
    const pad = $("pad");
    pad.innerHTML = "";
    ["1","2","3","4","5","6","7","8","9","C","0","\u232B"].forEach((k) => {
      const b = document.createElement("button");
      b.textContent = k;
      b.onclick = () => press(k);
      pad.appendChild(b);
    });
  }

  function startPin() {
    pin = "";
    paintDots();
    setPinMsg("", false);
    show("s-pin", "Hello " + chosenStaff.name + ", enter your PIN");
  }

  function paintDots() {
    document.querySelectorAll("#dots .dot").forEach((d, i) => d.classList.toggle("on", i < pin.length));
  }

  function setPinMsg(t, isErr) {
    $("pinMsg").textContent = t;
    $("pinMsg").className = "msg" + (isErr ? " err" : "");
  }

  function press(k) {
    if (busy) return;
    if (k === "C") pin = "";
    else if (k === "\u232B") pin = pin.slice(0, -1);
    else if (pin.length < 4) pin += k;
    paintDots();
    if (pin.length === 4) submitPin();
  }

  async function submitPin() {
    busy = true;
    setPinMsg("Checking...", false);
    try {
      const res = await fetch(SUPABASE_URL + "/functions/v1/staff-login", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
        body: JSON.stringify({ staff_id: chosenStaff.id, pin }),
      });
      const out = await res.json();
      if (!res.ok) throw new Error(out.error || "Login failed");
      const { error } = await sb.auth.setSession({ access_token: out.access_token, refresh_token: out.refresh_token });
      if (error) throw error;
      await loadHome();
    } catch (e) {
      pin = "";
      paintDots();
      setPinMsg(e.message === "Wrong PIN or account locked"
        ? "Wrong PIN, or locked for 15 minutes after 5 wrong tries."
        : "Login failed. Try again.", true);
    } finally {
      busy = false;
    }
  }

  async function loadHome() {
    const { data: u } = await sb.auth.getUser();
    if (!u || !u.user) return loadBranches();
    const { data: row, error } = await sb
      .from("staff")
      .select("name, business_id, branch_id, branches(name)")
      .eq("auth_user_id", u.user.id)
      .single();
    if (error || !row) { await sb.auth.signOut(); return loadBranches(); }
    me = row;
    $("welcome").textContent = "Welcome " + row.name;
    $("whereAmI").textContent = "Branch: " + (row.branches ? row.branches.name : "");
    show("s-home", "You are logged in");
    await loadCustomers();
  }

  async function loadCustomers() {
    const { data, error } = await sb.from("customers").select("id, name").order("created_at", { ascending: false });
    const ul = $("custList");
    ul.innerHTML = "";
    if (error) { $("homeMsg").textContent = "Could not load customers."; return; }
    $("custCount").textContent = "(" + data.length + ")";
    data.forEach((c) => { const li = document.createElement("li"); li.textContent = c.name; ul.appendChild(li); });
  }

  $("addCust").onclick = async () => {
    const name = $("custName").value.trim();
    if (!name || !me) return;
    const { error } = await sb.from("customers").insert({ name, business_id: me.business_id, branch_id: me.branch_id });
    $("homeMsg").textContent = error ? "Could not add customer." : "Added.";
    $("homeMsg").className = "msg" + (error ? " err" : "");
    if (!error) { $("custName").value = ""; await loadCustomers(); }
  };

  $("logout").onclick = async () => { await sb.auth.signOut(); me = null; loadBranches(); };
  $("backToBranch").onclick = loadBranches;
  $("backToStaff").onclick = loadStaff;

  buildPad();
  (async () => {
    const { data } = await sb.auth.getSession();
    if (data && data.session) await loadHome(); else await loadBranches();
  })();
</script>
</body>
</html>
